<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Knowledge Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Supabase provides real Auth, a real Postgres database with Row Level
     Security, and realtime sync — replacing the earlier Firebase draft. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F6F7F9;
    --card:#FFFFFF;
    --primary:#3B4C7A;
    --primary-light:#4E619180;
    --primary-hover:#46598C;
    --primary-soft:#EEF1F8;
    --primary-border:#DCE3F1;
    --success:#2E7A58;
    --success-soft:#E8F3EE;
    --success-border:#CBE4D8;
    --warning:#9C7318;
    --warning-soft:#FAF2E0;
    --warning-border:#EEDEB4;
    --danger:#A0422F;
    --danger-soft:#FAEBE7;
    --danger-border:#EFD3CC;
    --text:#1D2433;
    --text-2:#404A5C;
    --text-muted:#6E7789;
    --border:#E4E7EE;
    --border-strong:#D3D8E3;
    --radius:10px;
    --shadow:0 1px 2px rgba(24,30,46,.04), 0 2px 8px rgba(24,30,46,.05);
    --shadow-lg:0 10px 34px rgba(24,30,46,.16);
    --sidebar-w:236px;
    --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    --font-ar:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;overflow-x:hidden;}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);
       -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.6;}
  html[dir="rtl"] body{font-family:var(--font-ar);}
  html[dir="rtl"] input,html[dir="rtl"] textarea,html[dir="rtl"] select,html[dir="rtl"] button{font-family:var(--font-ar);}
  button,input,select,textarea{font-family:inherit;font-size:inherit;}
  ::selection{background:#CFD9EE;}

  #app{display:flex;min-height:100vh;}
  .sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--primary);color:#fff;
    display:flex;flex-direction:column;padding:18px 13px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 7px 15px;border-bottom:1px solid rgba(255,255,255,.13);margin-bottom:13px;}
  .brand-mark{width:33px;height:33px;border-radius:9px;background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0;}
  .brand-title{font-size:13.5px;font-weight:600;line-height:1.3;}
  .brand-sub{font-size:11px;color:rgba(255,255,255,.55);line-height:1.3;}
  .lang-toggle{display:flex;background:rgba(255,255,255,.1);border-radius:8px;padding:3px;margin-bottom:14px;gap:2px;}
  .lang-btn{flex:1;border:none;background:transparent;color:rgba(255,255,255,.62);font-size:11.5px;
    font-weight:700;padding:6px 4px;border-radius:6px;cursor:pointer;transition:.15s;}
  .lang-btn.active{background:rgba(255,255,255,.2);color:#fff;}
  .user-chip{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;background:rgba(255,255,255,.08);margin-bottom:14px;}
  .user-avatar{width:29px;height:29px;border-radius:50%;background:rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
  .user-meta{line-height:1.3;min-width:0;flex:1;}
  .user-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .user-role{font-size:10.5px;color:rgba(255,255,255,.55);}
  .icon-btn{background:transparent;border:none;color:rgba(255,255,255,.55);cursor:pointer;font-size:14px;padding:4px;flex-shrink:0;border-radius:5px;}
  .icon-btn:hover{color:#fff;background:rgba(255,255,255,.1);}
  .nav-group{display:flex;flex-direction:column;gap:2px;}
  .nav-label{font-size:10.5px;color:rgba(255,255,255,.42);padding:11px 10px 5px;letter-spacing:.3px;font-weight:600;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:rgba(255,255,255,.82);
    cursor:pointer;font-size:13.5px;border:none;background:transparent;width:100%;text-align:start;transition:.15s;}
  .nav-item:hover{background:rgba(255,255,255,.09);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,.16);color:#fff;font-weight:600;}
  .nav-icon{width:17px;text-align:center;flex-shrink:0;font-size:13.5px;}
  .nav-badge{margin-inline-start:auto;background:rgba(255,255,255,.18);font-size:10.5px;padding:1px 7px;border-radius:20px;}
  .sidebar-spacer{flex:1;min-height:14px;}

  .main{flex:1;min-width:0;padding:30px 34px 64px;}
  .container{max-width:920px;margin:0 auto;}
  .container-wide{max-width:1200px;margin:0 auto;}

  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
  .page-title{font-size:21px;font-weight:700;margin:0 0 3px;letter-spacing:-.2px;}
  .page-sub{font-size:13px;color:var(--text-muted);margin:0;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:8px;
    border:1px solid transparent;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;}
  .btn:active{transform:scale(.985);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-hover);}
  .btn-outline{background:#fff;color:var(--primary);border-color:var(--border-strong);}
  .btn-outline:hover{border-color:var(--primary);}
  .btn-ghost{background:transparent;color:var(--text-muted);}
  .btn-ghost:hover{background:var(--primary-soft);color:var(--text);}
  .btn-danger{background:#fff;color:var(--danger);border-color:var(--danger-border);}
  .btn-danger:hover{background:var(--danger-soft);}
  .btn-danger-solid{background:var(--danger);color:#fff;}
  .btn-danger-solid:hover{opacity:.92;}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
  .card-pad{padding:22px;}

  .hero{text-align:center;padding:52px 18px 8px;}
  .hero h1{font-size:25px;font-weight:700;margin:0 0 8px;letter-spacing:-.3px;}
  .hero p{color:var(--text-muted);font-size:13.5px;margin:0 0 26px;}
  .search-shell{display:flex;gap:8px;background:#fff;border:1px solid var(--border-strong);border-radius:12px;
    padding:6px;box-shadow:var(--shadow);max-width:660px;margin:0 auto;transition:.15s;}
  .search-shell:focus-within{border-color:var(--primary);}
  .search-shell input{flex:1;border:none;outline:none;font-size:15px;padding:10px 12px;background:transparent;color:var(--text);}
  .search-icon{display:flex;align-items:center;padding-inline-start:10px;color:var(--text-muted);}
  .search-filters{display:flex;gap:10px;justify-content:center;margin:16px auto 0;max-width:660px;flex-wrap:wrap;}
  .filter-select{padding:7px 10px;border-radius:7px;border:1px solid var(--border-strong);background:#fff;font-size:12.5px;color:var(--text-2);}
  .quick-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
  .quick-tag{padding:6px 13px;border-radius:20px;background:#fff;border:1px solid var(--border);
    color:var(--text-2);font-size:12px;cursor:pointer;transition:.15s;}
  .quick-tag:hover{border-color:var(--primary);color:var(--primary);}

  .results-wrap{margin-top:28px;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
  .best-match-tag{display:inline-flex;align-items:center;gap:6px;background:var(--success-soft);color:var(--success);
    font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:20px;margin-bottom:10px;}
  .result-card{padding:0;overflow:hidden;margin-bottom:14px;}
  .result-head{padding:19px 22px 15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
  .result-title{font-size:18px;font-weight:700;margin:0 0 7px;line-height:1.4;}
  .result-meta{display:flex;gap:7px;flex-wrap:wrap;}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--primary-soft);
    color:var(--primary);border:1px solid var(--primary-border);}
  .badge-team{background:#F2F0F9;color:#584A8C;border-color:#E3DEF2;}
  .badge-type{background:#FFF;color:var(--text-muted);border-color:var(--border-strong);}
  .badge-active{background:var(--success-soft);color:var(--success);border-color:var(--success-border);}
  .badge-inactive{background:#F2F3F6;color:var(--text-muted);border-color:var(--border-strong);}
  .badge-warn{background:var(--warning-soft);color:var(--warning);border-color:var(--warning-border);}
  .fav-btn{border:1px solid var(--border-strong);background:#fff;border-radius:8px;width:34px;height:34px;
    font-size:15px;cursor:pointer;color:var(--text-muted);flex-shrink:0;transition:.15s;}
  .fav-btn:hover{border-color:#DCBA6A;}
  .fav-btn.active{background:#FDF7E7;border-color:#E6CE8E;color:#96751F;}

  .result-body{padding:6px 22px 20px;}
  .section-block{padding:16px 0;border-bottom:1px solid var(--border);}
  .section-block:last-child{border-bottom:none;padding-bottom:4px;}
  .section-block h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin:0 0 9px;font-weight:700;}
  .section-block p{margin:0;font-size:14px;line-height:1.75;color:var(--text-2);}
  .response-box{background:var(--primary-soft);border:1px solid var(--primary-border);border-radius:9px;padding:15px 16px;position:relative;}
  .response-box p{white-space:pre-wrap;color:var(--text);}
  .copy-btn{position:absolute;top:10px;inset-inline-end:10px;background:#fff;border:1px solid var(--border-strong);
    border-radius:6px;font-size:11.5px;padding:4px 10px;cursor:pointer;color:var(--text-muted);font-weight:600;transition:.15s;}
  .copy-btn:hover{color:var(--primary);border-color:var(--primary);}
  .steps-list{margin:0;padding-inline-start:0;list-style:none;display:flex;flex-direction:column;gap:10px;}
  .steps-list li{display:flex;gap:11px;font-size:14px;line-height:1.65;align-items:flex-start;color:var(--text-2);}
  .step-num{width:21px;height:21px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;
    font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:3px;}
  .escalation-box{border-radius:9px;padding:15px 16px;display:flex;flex-direction:column;gap:8px;}
  .escalation-yes{background:var(--warning-soft);border:1px solid var(--warning-border);}
  .escalation-no{background:var(--success-soft);border:1px solid var(--success-border);}
  .escalation-row{display:flex;gap:9px;font-size:13.5px;align-items:baseline;flex-wrap:wrap;}
  .escalation-row b{min-width:145px;font-weight:700;color:var(--text);}
  .req-info-list{margin:0;padding-inline-start:20px;font-size:14px;line-height:1.85;color:var(--text-2);}
  .notes-box{background:#FBFBFC;border:1px dashed var(--border-strong);border-radius:9px;padding:13px 15px;font-size:13.5px;color:var(--text-2);line-height:1.7;}
  .quality-item{border:1px solid var(--border);border-radius:9px;padding:13px 15px;margin-bottom:9px;background:#FCFCFD;}
  .quality-item:last-child{margin-bottom:0;}
  .quality-item-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:7px;}
  .quality-item-title{font-size:13.5px;font-weight:700;color:var(--text);}
  .quality-line{font-size:13px;color:var(--text-2);line-height:1.65;margin-top:4px;}
  .quality-line b{color:var(--text-muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:1px;}
  .prio{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;white-space:nowrap;}
  .prio-critical{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger-border);}
  .prio-high{background:var(--warning-soft);color:var(--warning);border:1px solid var(--warning-border);}
  .prio-medium{background:var(--primary-soft);color:var(--primary);border:1px solid var(--primary-border);}
  .prio-low{background:#F2F3F6;color:var(--text-muted);border:1px solid var(--border-strong);}

  .accordion{border:1px solid var(--border);border-radius:9px;overflow:hidden;}
  .accordion summary{padding:12px 15px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--text-2);
    background:#FBFBFC;list-style:none;display:flex;align-items:center;gap:8px;}
  .accordion summary::-webkit-details-marker{display:none;}
  .accordion summary:before{content:"▸";font-size:11px;color:var(--text-muted);transition:.15s;}
  .accordion[open] summary:before{transform:rotate(90deg);}
  html[dir="rtl"] .accordion summary:before{content:"◂";}
  html[dir="rtl"] .accordion[open] summary:before{transform:rotate(-90deg);}
  .accordion-body{padding:15px;border-top:1px solid var(--border);}

  .other-matches h5{font-size:12.5px;color:var(--text-muted);margin:0 0 10px;font-weight:600;}
  .other-match-row{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:#fff;
    border:1px solid var(--border);border-radius:9px;margin-bottom:8px;cursor:pointer;transition:.15s;}
  .other-match-row:hover{border-color:var(--primary);}
  .other-match-row .t{font-size:13.5px;font-weight:600;}
  .other-match-row .c{font-size:11.5px;color:var(--text-muted);margin-top:1px;}

  .no-match{text-align:center;padding:44px 20px;}
  .no-match .icon{font-size:32px;margin-bottom:10px;opacity:.7;}
  .no-match h3{font-size:16px;margin:0 0 7px;}
  .no-match p{color:var(--text-muted);font-size:13.5px;margin:0 0 18px;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);
    color:#fff;padding:10px 20px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);
    opacity:0;pointer-events:none;transition:.22s;z-index:999;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;padding:20px;}
  .login-card{width:390px;max-width:100%;padding:34px;text-align:center;}
  .login-logo{width:46px;height:46px;border-radius:12px;background:var(--primary);color:#fff;margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;}
  .login-card h2{font-size:18px;margin:0 0 5px;}
  .login-card>p{font-size:13px;color:var(--text-muted);margin:0 0 24px;}
  .login-lang{display:flex;justify-content:center;gap:4px;margin-bottom:20px;}
  .login-lang button{border:1px solid var(--border-strong);background:#fff;color:var(--text-muted);font-size:11.5px;
    font-weight:700;padding:5px 14px;border-radius:7px;cursor:pointer;}
  .login-lang button.active{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-border);}
  .field{margin-bottom:15px;text-align:start;}
  .field label{font-size:12.5px;font-weight:600;color:var(--text-2);display:block;margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border-strong);
    outline:none;background:#fff;color:var(--text);font-size:14px;transition:.15s;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);}
  .field textarea{resize:vertical;min-height:70px;line-height:1.65;}
  .field-hint{font-size:11.5px;color:var(--text-muted);font-weight:400;}
  .pass-row{position:relative;}
  .pass-row input{padding-inline-end:62px;}
  .pass-row button{position:absolute;inset-inline-end:7px;top:50%;transform:translateY(-50%);background:transparent;
    border:none;font-size:11.5px;color:var(--primary);cursor:pointer;font-weight:600;padding:4px 6px;}
  .login-error{background:var(--danger-soft);color:var(--danger);font-size:12.5px;padding:9px 12px;
    border-radius:8px;margin-bottom:15px;border:1px solid var(--danger-border);text-align:start;}
  .demo-note{margin-top:20px;font-size:11.5px;color:var(--text-muted);background:#FBFBFC;border:1px dashed var(--border-strong);
    border-radius:8px;padding:10px 12px;line-height:1.8;text-align:start;}
  .demo-note code{background:#EEF0F4;padding:1px 6px;border-radius:4px;font-size:11px;}

  .tabbar{display:flex;gap:3px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto;}
  .tab{padding:10px 14px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;
    border-bottom:2px solid transparent;white-space:nowrap;transition:.15s;}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--primary);border-color:var(--primary);}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  .stat-card{padding:17px 19px;}
  .stat-card .n{font-size:25px;font-weight:700;letter-spacing:-.5px;}
  .stat-card .l{font-size:12px;color:var(--text-muted);margin-top:2px;line-height:1.4;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
  .panel-title{margin:0 0 15px;font-size:13px;font-weight:700;}
  .bar-row{display:flex;align-items:center;gap:11px;margin-bottom:11px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-label{font-size:12.5px;width:145px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2);}
  .bar-track{flex:1;background:#EEF0F4;border-radius:6px;height:8px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--primary);border-radius:6px;opacity:.75;}
  .bar-count{font-size:12px;color:var(--text-muted);width:26px;text-align:end;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:start;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);
    padding:11px 14px;border-bottom:1px solid var(--border);font-weight:700;white-space:nowrap;}
  td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text-2);}
  tr:last-child td{border-bottom:none;}
  tr.tr-hover:hover{background:#FAFBFC;cursor:pointer;}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .empty-state{text-align:center;padding:52px 20px;color:var(--text-muted);font-size:13.5px;}
  .empty-state .icon{font-size:26px;margin-bottom:10px;opacity:.6;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .search-mini{display:flex;align-items:center;gap:8px;border:1px solid var(--border-strong);border-radius:8px;
    padding:8px 11px;background:#fff;min-width:230px;}
  .search-mini input{border:none;outline:none;font-size:13px;flex:1;background:transparent;}

  .modal-overlay{position:fixed;inset:0;background:rgba(20,25,38,.48);display:flex;align-items:center;
    justify-content:center;z-index:200;animation:fadeIn .18s ease;padding:20px;}
  .modal{background:#fff;border-radius:12px;box-shadow:var(--shadow-lg);width:440px;max-width:100%;padding:26px;animation:pop .18s ease;}
  @keyframes pop{from{transform:scale(.97);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal.wide{width:680px;}
  .modal h3{margin:0 0 9px;font-size:16.5px;}
  .modal>p{margin:0 0 20px;font-size:13.5px;color:var(--text-muted);line-height:1.65;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
  .modal-scroll{max-height:68vh;overflow-y:auto;margin-bottom:18px;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px 16px;}
  .form-full{grid-column:1/-1;}
  .lang-section{border:1px solid var(--border);border-radius:10px;padding:18px;margin-top:6px;background:#FCFCFD;}
  .lang-section-head{display:flex;align-items:center;gap:9px;margin-bottom:15px;}
  .lang-flag{font-size:11px;font-weight:700;background:var(--primary-soft);color:var(--primary);
    padding:3px 10px;border-radius:6px;border:1px solid var(--primary-border);}
  .lang-section-head span{font-size:12px;color:var(--text-muted);}
  .divider{height:1px;background:var(--border);margin:22px 0;}
  .form-section-title{font-size:13px;font-weight:700;margin:0 0 4px;}
  .form-section-desc{font-size:12.5px;color:var(--text-muted);margin:0 0 14px;line-height:1.6;}

  .manage-list-item{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;

/* ============================= 3. AUTH / RBAC ============================= */
/* Permissions are declared here, not inferred from which buttons happen to
   be rendered. Every view render and every mutating action calls a guard,
   so an employee reaching an admin view by any means is still refused
   *through the UI*.
   Real security now lives where it belongs: Supabase Auth verifies every
   password server-side (nothing password-related ever touches this file),
   and Postgres Row Level Security enforces who may read/write which rows
   regardless of what this JS does. The guard()/can() checks below are a
   convenience layer on top of that — they keep the UI honest and give
   instant feedback, but the real boundary is now in the database. */
const PERMISSIONS = {
  admin:    ["search","favorites","history","qualityerrors","dashboard","knowledge","quality",
             "users","categories","teams","searchhistory","missing","statistics","settings"],
  employee: ["search","favorites","history","qualityerrors"]
};
const ADMIN_ONLY_ACTIONS = ["knowledge.write","quality.write","qualityerrors.write","users.write",
                            "categories.write","teams.write","types.write","settings.write","missing.write"];

function can(view){
  if(!state.session) return false;
  const perms = PERMISSIONS[state.session.role] || [];
  return perms.indexOf(view) !== -1;
}
/* Guard for mutating operations. Returns false and refuses silently-safely
   if the current session lacks the role. */
function guard(action){
  if(!state.session){ showToast(t('accessDenied')); return false; }
  if(ADMIN_ONLY_ACTIONS.indexOf(action) !== -1 && state.session.role !== 'admin'){
    showToast(t('accessDenied'));
    state.view = defaultViewFor(state.session.role);
    render();
    return false;
  }
  return true;
}
function defaultViewFor(role){ return role === 'admin' ? 'dashboard' : 'search'; }

/* ========================= 4b. SHARED DATA STORE =========================
   The knowledge-base content (categories, teams, types, items, quality
   rules/errors, missing requests, settings) lives in ONE row of the
   `kb_data` Postgres table, as a jsonb column. Row Level Security only
   lets an authenticated user READ it, and only an admin WRITE it — so
   even someone poking the API directly with devtools cannot edit it
   without the right role. Realtime (Postgres Changes) pushes every write
   to every open viewer instantly.

   `users`, `searchHistory` and `favoritesByUser` are deliberately NOT in
   this blob — see the note above their declarations. */
const KB_TABLE = "kb_data";
let db = null;             // the Supabase client, or null if unavailable
let kbChannel = null;

function snapshot(){
  return { categories, teams, knowledgeTypes, knowledgeItems, qualityRules,
           qualityErrors, missingRequests, settings };
}
function applySnapshot(d){
  if(!d) return;
  if(d.categories) categories = d.categories;
  if(d.teams) teams = d.teams;
  if(d.knowledgeTypes) knowledgeTypes = d.knowledgeTypes;
  if(d.knowledgeItems) knowledgeItems = d.knowledgeItems;
  if(d.qualityRules) qualityRules = d.qualityRules;
  if(d.qualityErrors) qualityErrors = d.qualityErrors;
  if(d.missingRequests) missingRequests = d.missingRequests;
  if(d.settings) settings = d.settings;
}

let lastSerialized = null;   // guards against write loops
let persistTimer = null;
let booted = false;
let applyingRemote = false;  // true while an incoming row is being applied

/* Called after every render. Writes only when the data actually changed,
   so applying a remote update never bounces back as a new write. Fails
   silently (and harmlessly) for a non-admin, since RLS refuses the write —
   the UI already hid the editing controls from them anyway. */
function schedulePersist(){
  if(!booted || applyingRemote) return;
  const ser = JSON.stringify(snapshot());
  if(ser === lastSerialized) return;
  lastSerialized = ser;
  if(!db) return;
  clearTimeout(persistTimer);
  persistTimer = setTimeout(()=>{
    db.from(KB_TABLE).update({ data: JSON.parse(ser) }).eq('id', 1)
      .then(({error})=>{ if(error) console.warn('kb_data write refused:', error.message); });
  }, 350);
}

/* Live subscription: Postgres Changes fires every time ANY viewer (this
   one or another) updates the row. */
function subscribeRemote(){
  if(!db) return;
  if(kbChannel) db.removeChannel(kbChannel);
  kbChannel = db.channel('kb_data_changes')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: KB_TABLE, filter: 'id=eq.1' },
      payload=>{
        console.log('[kb realtime] change received:', payload);
        applyingRemote = true;
        applySnapshot(payload.new.data);
        lastSerialized = JSON.stringify(snapshot());
        applyingRemote = false;
        state.lastSync = nowTimeStr();
        if(booted) render();
      })
    .subscribe((status, err)=>{
      console.log('[kb realtime] subscription status:', status, err||'');
    });
}
function syncNow(){
  if(!db){ showToast(t('syncLocalHint')); return; }
  showToast(t('syncDone'));
}

/* ============================== 6. SEARCH ============================== */
/* Scores the query against BOTH language corpora of every item, so an
   Arabic query matches an item whose English version is displayed, and
   vice versa. Results are shown in the user's active language.          */
function normalize(s){
  return String(s||"").toLowerCase()
    .replace(/[\u0640]/g,"")                       // tatweel
    .replace(/[\u064B-\u0652]/g,"")                // harakat
    .replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
    .replace(/[؟?!.,،؛;:"'()\-\/]/g," ")
    .replace(/\s+/g," ").trim();
}
const STOPWORDS = new Set(["the","and","for","that","with","this","from","client","customer",
  "his","her","still","not","has","have","was","are","بتاع","بتاعه","إن","ان","على","عن","من","في",
  "مش","لسه","اللي","هو","هي","العميل","عميل","بيقول","يقول","ان","إلى","الى"]);
function tokenize(s){ return normalize(s).split(" ").filter(x=>x.length>=2 && !STOPWORDS.has(x)); }
function corpusOf(item){
  const parts=[];
  ['en','ar'].forEach(L=>{
    const v=item[L]; if(!v) return;
    parts.push(v.title||"", (v.keywords||[]).join(" "), (v.exampleQuestions||[]).join(" "), v.explanation||"");
  });
  parts.push(item.category||"", item.subcategory||"");
  return normalize(parts.join(" "));
}
function scoreItem(item, tokens, raw){
  const corpus=corpusOf(item);
  const titles=normalize((item.en&&item.en.title||"")+" "+(item.ar&&item.ar.title||""));
  let score=0;
  tokens.forEach(tok=>{
    if(titles.includes(tok)) score+=2;
    else if(corpus.includes(tok)) score+=1;
    else if(tok.length>=4 && (corpus.includes(tok.slice(0,-1))||corpus.includes(tok.slice(1)))) score+=0.5;
  });
  const rawN=normalize(raw);
  if(rawN && titles.includes(rawN)) score+=3;
  return score;
}
function runSearch(query){
  const tokens=tokenize(query);
  const pool=knowledgeItems.filter(it=>{
    if(state.filterStatus!=="All" && it.status!==state.filterStatus) return false;
    if(state.filterCategory!=="All" && it.category!==state.filterCategory) return false;
    if(state.filterTeam!=="All" && it.responsibleTeam!==state.filterTeam) return false;
    return true;
  });
  const scored=pool.map(it=>({item:it,score:scoreItem(it,tokens,query)}))
                   .filter(s=>s.score>0).sort((a,b)=>b.score-a.score);
  logSearch(query, scored.length?scored[0].item:null);
  if(!scored.length) return {query,best:null,others:[]};
  return {query,best:scored[0].item,others:scored.slice(1,4).map(s=>s.item)};
}
function logSearch(query,item,titleOverride){
  const row = {
    id:nextId("h"), query, date:todayStr(), time:nowTimeStr(),
    category:item?item.category:(titleOverride?"Trading":"—"),
    team:item?(item.responsibleTeam||"—"):(titleOverride?"Financial Department":"—"),
    resultId:item?item.id:null,
    resultTitle:item?(C(item,'title')):(titleOverride||null),
    agent:state.session?state.session.name:"—"
  };
  searchHistory.unshift(row);
  if(db && state.session){
    db.from('search_history').insert({
      user_id: state.session.userId, query,
      category: row.category, team: row.team,
      result_id: row.resultId, result_title: row.resultTitle,
      agent_name: row.agent
    }).then(({error})=>{ if(error) console.warn('history insert failed:', error.message); });
  }
}

/* ============================== 7. RENDER ROOT ============================== */
function render(){
  const app=document.getElementById('app');
  if(!state.session){ app.innerHTML=renderLogin(); return; }
  // Guard: if the current view is not permitted for this role, fall back.
  if(!can(state.view)) state.view=defaultViewFor(state.session.role);
  const wide=['dashboard','knowledge','quality','users','searchhistory','missing','statistics'].includes(state.view);
  app.innerHTML=`
    ${renderSidebar()}
    <div class="main"><div class="${wide?'container-wide':'container'}">${renderView()}</div></div>
    ${state.modal?renderModal():''}`;
  document.removeEventListener('keydown',escHandler);
  document.addEventListener('keydown',escHandler);
  schedulePersist();
}
function escHandler(e){ if(e.key==='Escape'&&state.modal) closeModal(); }

function goTo(v){

  state.view=v; state.editingItemId=null; state.editingRuleId=null;
  state.editingUserId=null; state.editingErrorId=null; state.errorFilter="";
  closeSidebarMobile(); render();
}
function renderView(){
  switch(state.view){
    case 'search': return renderSearch();
    case 'favorites': return renderFavorites();
    case 'history': return renderHistory(false);
    case 'qualityerrors': return state.session.role==='admin'
        ? (state.editingErrorId!==null?renderErrorForm():renderErrorsAdmin())
        : renderErrorsAgent();
    case 'searchhistory': return renderHistory(true);
    case 'dashboard': return renderDashboard();
    case 'knowledge': return state.editingItemId!==null?renderKnowledgeForm():renderKnowledgeList();
    case 'quality': return state.editingRuleId!==null?renderQualityForm():renderQualityList();
    case 'users': return state.editingUserId!==null?renderUserForm():renderUsersList();
    case 'categories': return renderSimpleList('categories');
    case 'teams': return renderSimpleList('teams');
    case 'missing': return renderMissing();
    case 'statistics': return renderStatistics();
    case 'settings': return renderSettings();
    default: return renderSearch();
  }
}

/* Usernames (not emails) are what the login screen asks for, to match the
   existing UI — Supabase Auth itself only speaks email, so each username
   maps to a fixed pseudo-email under this constant domain (accounts are
   still created with real passwords in the Supabase Dashboard; only the
   address format is synthetic, nothing is actually emailed there). */
const AUTH_EMAIL_DOMAIN = "maxify-knowledge.local";
function usernameToEmail(u){ return u.trim().toLowerCase()+"@"+AUTH_EMAIL_DOMAIN; }

/* Basic client-side lockout: after MAX_LOGIN_ATTEMPTS failures for a given
   username, block further attempts for LOCKOUT_MS. This is on top of, not
   instead of, Supabase's own server-side auth checks — a deterrent against
   casual retyping, not a substitute for real rate limiting. */
const MAX_LOGIN_ATTEMPTS = 5;
const LOCKOUT_MS = 30000;
let loginAttempts = {}; // { usernameLower: {count, lockedUntil} }

async function doLogin(){
  const u=(document.getElementById('li_user').value||'').trim();
  const p=document.getElementById('li_pass').value||'';
  const key=u.toLowerCase();
  const rec=loginAttempts[key];
  if(rec && rec.lockedUntil && Date.now()<rec.lockedUntil){
    const secsLeft=Math.ceil((rec.lockedUntil-Date.now())/1000);
    state.loginError=t('loginLocked').replace('{s}',secsLeft);
    render(); return;
  }
  if(!db){ state.loginError=t('loginFailed'); render(); return; }

  const {data, error} = await db.auth.signInWithPassword({ email: usernameToEmail(u), password: p });
  if(error || !data.session){
    loginAttempts[key]=loginAttempts[key]||{count:0,lockedUntil:0};
    loginAttempts[key].count++;
    if(loginAttempts[key].count>=MAX_LOGIN_ATTEMPTS){
      loginAttempts[key].lockedUntil=Date.now()+LOCKOUT_MS;
      loginAttempts[key].count=0;
      state.loginError=t('loginLocked').replace('{s}',Math.ceil(LOCKOUT_MS/1000));
    } else {
      state.loginError=t('loginFailed');
    }
    render(); return;
  }

  // Auth succeeded — now load this person's role/status from `profiles`.
  // Real access control has already happened server-side (Supabase just
  // verified the password); this is just fetching who they are.
  const {data:profile, error:pErr} = await db.from('profiles').select('*').eq('id', data.user.id).single();
  if(pErr || !profile || profile.status!=='Active'){
    await db.auth.signOut();
    state.loginError = (!profile||pErr) ? t('loginFailed') : t('accountInactive');
    render(); return;
  }

  delete loginAttempts[key];
  db.from('profiles').update({last_login: new Date().toISOString()}).eq('id', profile.id).then(()=>{});
  state.session={userId:profile.id, name:profile.name, username:profile.username, role:profile.role};
  state.loginError=""; state.view=defaultViewFor(profile.role);
  await Promise.all([fetchMyFavorites(), fetchMyHistory(), fetchKbData(), profile.role==='admin'?fetchProfiles():Promise.resolve()]);
  render();
}
function logout(){
  if(db){ db.auth.signOut(); if(kbChannel) db.removeChannel(kbChannel); kbChannel=null; }
  state.session=null; state.view='login'; state.lastResults=null;
  searchHistory=[]; favoritesByUser={}; users=[];
  render();
}

function toggleFav(id){
  const favs=myFavorites(); const i=favs.indexOf(id);
  if(i===-1){
    favs.push(id); showToast(t('addedFav'));
    if(db && state.session) db.from('favorites').insert({user_id:state.session.userId, item_id:id})
      .then(({error})=>{ if(error) console.warn('favorite insert failed:', error.message); });
  } else {
    favs.splice(i,1); showToast(t('removedFav'));
    if(db && state.session) db.from('favorites').delete()
      .eq('user_id', state.session.userId).eq('item_id', id)
      .then(({error})=>{ if(error) console.warn('favorite delete failed:', error.message); });
  }
  render();

function reportMissing(q){
  const ex=missingRequests.find(m=>normalize(m.question)===normalize(q));
  if(ex) ex.count++;
  else missingRequests.push({id:nextId("m"),question:q,count:1,date:todayStr(),status:"Pending"});
  showToast(t('reported')); render();
}

}

  if(!guard('knowledge.write')) return;
  knowledgeItems=knowledgeItems.filter(i=>i.id!==id);
  qualityRules=qualityRules.filter(q=>q.knowledgeId!==id);
  // Only this session's own cache/row can be touched (RLS scopes favorites
  // to their owner); other users' now-orphaned favorite rows are harmless —
  // anywhere favorites are rendered, missing items are filtered out.
  if(state.session){
    favoritesByUser[state.session.userId] = (favoritesByUser[state.session.userId]||[]).filter(f=>f!==id);
    if(db) db.from('favorites').delete().eq('user_id', state.session.userId).eq('item_id', id);

/* ======================= QUALITY ERROR CLASSIFICATION ======================= */
const SEVERITIES=["Critical","High","Medium","Low"];
function sevRank(x){ const i=SEVERITIES.indexOf(x); return i===-1?9:i; }
function sortedErrors(list){
  return [...list].sort((a,b)=>sevRank(a.severity)-sevRank(b.severity)||String(a.code).localeCompare(String(b.code)));
}
function findError(id){ return qualityErrors.find(e=>e.id===id); }

function readErrLang(L){

function saveError(idOrNew){

  if(!code||(!en.title&&!ar.title)){ showToast(t('errorRequiredFields')); return; }
  const payload={code,severity:document.getElementById('e_severity').value,
    category:document.getElementById('e_category').value.trim(),
    status:document.getElementById('e_status').value, en, ar};

    qualityErrors.push(Object.assign({id:nextId('qe'),createdAt:todayStr()},payload));
    showToast(t('errorAdded'));

function activeAdminCount(){ return users.filter(u=>u.role==='admin'&&u.status==='Active').length; }
function toggleUserStatus(id){
  if(!guard('users.write'))return;
  const u=findUser(id); if(!u)return;
  if(u.id===state.session.userId){ showToast(t('cannotDeactivateSelf')); return; }
  if(u.status==='Active'&&u.role==='admin'&&activeAdminCount()<=1){ showToast(t('lastAdminWarning')); return; }

  u.status=newStatus; render(); showToast(t('markedAs')+' '+statusLabel(newStatus));
  if(db) db.from('profiles').update({status:newStatus}).eq('id', id)

   which this frontend intentionally never holds — per the security
   requirements, that key can never sit in browser-shipped code. So this
   stays a Supabase Dashboard action for now (Authentication → Users →
   delete). Deactivating via the button above is the safe in-app equivalent
   — it blocks login immediately without needing that privileged key. */

/* Editing only touches `profiles` (name/role/status) — creating accounts
   and setting their first password happens in the Supabase Dashboard,
   see the notes above. */
async function saveUser(id){
  if(!guard('users.write')) return;
  const u=findUser(id); if(!u) return;
  const name=document.getElementById('u_name').value.trim();
  const role=document.getElementById('u_role').value;
  const status=document.getElementById('u_status').value;
  if(!name){ showToast(t('usernameRequired')); return; }
  if(u.id===state.session.userId&&(role!=='admin'||status!=='Active')){ showToast(t('cannotDeactivateSelf')); return; }
  if(u.role==='admin'&&u.status==='Active'&&(role!=='admin'||status!=='Active')&&activeAdminCount()<=1){
    showToast(t('lastAdminWarning')); return; }
  const prev={name:u.name,role:u.role,status:u.status};
  Object.assign(u,{name,role,status});
  if(u.id===state.session.userId) state.session.name=name;
  state.editingUserId=null; render(); showToast(t('userUpdated'));
  if(db){
    const {error} = await db.from('profiles').update({name,role,status}).eq('id', id);
    if(error){ Object.assign(u,prev); showToast(error.message); render(); }
  }
}

function addEntry(kind){
  if(!guard(kind+'.write'))return;
  const el=document.getElementById('newEntry'); const v=el.value.trim(); if(!v)return;
  const arr=kind==='categories'?categories:teams;
  if(arr.includes(v)){ showToast(t('alreadyExists')); return; }
  arr.push(v); render(); showToast(t('added'));
}
function renameEntry(kind,i,v){
  if(!guard(kind+'.write'))return;
  const arr=kind==='categories'?categories:teams; const old=arr[i]; v=v.trim();
  if(!v){ render(); return; }
  arr[i]=v;
  knowledgeItems.forEach(it=>{
    if(kind==='categories'&&it.category===old) it.category=v;
    if(kind==='teams'&&it.responsibleTeam===old) it.responsibleTeam=v;
  });
  if(kind==='categories') qualityRules.forEach(r=>{ if(r.category===old) r.category=v; });
  showToast(t('updated'));
}
function removeEntry(kind,i){
  if(!guard(kind+'.write'))return;
  const arr=kind==='categories'?categories:teams; arr.splice(i,1); render(); showToast(t('removed'));
}

/* ============================== BOOT ==============================
   Initialize Supabase, restore an existing session if the browser still
   has one (the Supabase SDK persists that itself), and load the shared
   knowledge base + this user's own favorites/history once we know who
   they are. Before anyone signs in, RLS won't even let us read `kb_data`
   — that's by design — so the built-in demo content shows until login. */

/* ========================= SUPABASE CONFIG =========================
   From your project: Settings → API Keys. The "Publishable" key (or
   older projects: the `anon` `public` key) is meant to be public in
   frontend code — real protection comes from the RLS policies we set up,
   not from hiding this value. NEVER put a "Secret"/`service_role` key
   here or anywhere in this file. */
const SUPABASE_URL = "https://pjhicbaptolerzeziyrp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_XQeN3vifkRIpXHXHAhS6GA_DPoV4oMd";

/* Loads the shared kb_data row (only readable once authenticated). If it's
   still the empty default an admin's first login seeds it with today's
   built-in demo content, exactly as the earlier Firebase draft did —
   nothing invented, just what was already here. Then subscribes to live
   updates from every other viewer. */
async function fetchKbData(){
  if(!db) return;
  try{
    const {data,error} = await db.from(KB_TABLE).select('data').eq('id',1).single();
    if(!error && data){
      const isEmpty = !data.data || Object.keys(data.data).length===0;
      if(isEmpty){
        if(state.session && state.session.role==='admin'){
          await db.from(KB_TABLE).update({data:snapshot()}).eq('id',1);
        }
      } else {
        applySnapshot(data.data);
      }
      lastSerialized = JSON.stringify(snapshot());
      state.lastSync = nowTimeStr();
    }
  }catch(e){ /* proceed with whatever's already in memory */ }
  subscribeRemote();
}

(async function init(){
  const r=document.getElementById('htmlRoot');
  r.setAttribute('lang',state.lang);
  r.setAttribute('dir', state.lang==='ar'?'rtl':'ltr');

  if(SUPABASE_URL && SUPABASE_ANON_KEY && typeof window.supabase!=='undefined'){
    try{ db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
    catch(e){ db = null; }
  }

  if(db){
    try{
      const {data:{session}} = await db.auth.getSession();
      if(session){
        const {data:profile} = await db.from('profiles').select('*').eq('id', session.user.id).single();
        if(profile && profile.status==='Active'){
          state.session={userId:profile.id, name:profile.name, username:profile.username, role:profile.role};
          state.view=defaultViewFor(profile.role);
          await Promise.all([
            fetchMyFavorites(), fetchMyHistory(), fetchKbData(),
            profile.role==='admin' ? fetchProfiles() : Promise.resolve()
          ]);
        } else {
          await db.auth.signOut();
        }
      }
    }catch(e){ /* proceed logged out — login screen will show */ }
  }

  state.lang = settings.defaultLanguage || state.lang;
  r.setAttribute('lang',state.lang);
  r.setAttribute('dir', state.lang==='ar'?'rtl':'ltr');

  lastSerialized = JSON.stringify(snapshot());
  booted = true;
  render();
})();
</script>
